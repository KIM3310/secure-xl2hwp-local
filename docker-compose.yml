services:
  secure-xl2hwp:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: prod
      RUNTIME_OWNER: customer
      RUNTIME_WORKERS: 1
      AUTH_RATE_LIMIT_MODE: upstream-enforced
      AUDIT_STORAGE_MODE: persistent-filesystem
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:?Set AUTH_PASSWORD_PEPPER in .env}
      EXPORT_SIGNING_KEY: ${EXPORT_SIGNING_KEY:?Set EXPORT_SIGNING_KEY in .env}
      ENABLE_LLM: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PRIMARY_MODEL: qwen2.5:7b
      LLM_FALLBACK_MODEL: qwen2.5:14b
    volumes:
      - ./examples:/app/examples
      - ./specs:/app/specs
      - ./logs:/app/logs
