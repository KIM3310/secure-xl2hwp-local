[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-xl2hwp-local"
version = "1.0.0"
description = "Local-first secure Excel extraction/cleanup to Hancom payload workflow with SpecKit + CoT pipeline"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Doeon Kim", email = "ehdjs1351@gmail.com"}]
license = "MIT"
keywords = ["fastapi", "air-gapped", "local-first", "hancom", "document-automation", "speckit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "Topic :: Office/Business",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pandas>=2.2.0,<3.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "orjson>=3.10.0,<4.0.0",
  "jinja2>=3.1.0,<4.0.0"
]

[project.urls]
Homepage = "https://github.com/KIM3310/secure-xl2hwp-local"
Documentation = "https://github.com/KIM3310/secure-xl2hwp-local/blob/main/README.md"
Repository = "https://github.com/KIM3310/secure-xl2hwp-local"
Issues = "https://github.com/KIM3310/secure-xl2hwp-local/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.6.0,<1.0.0"
]

[project.scripts]
secure-xl2hwp = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP007", "UP045", "B008"]
