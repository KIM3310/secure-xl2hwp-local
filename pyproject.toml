[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-xl2hwp-local"
version = "0.1.0"
description = "Local-first secure Excel extraction/cleanup to Hancom payload service with SpecKit + CoT pipeline"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Kim", email = "kim@example.com" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pandas>=2.2.0,<3.0.0",
  "openpyxl>=3.1.0,<4.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "orjson>=3.10.0,<4.0.0",
  "jinja2>=3.1.0,<4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.0,<1.0.0"
]

[project.scripts]
secure-xl2hwp = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP007", "UP045", "B008"]
